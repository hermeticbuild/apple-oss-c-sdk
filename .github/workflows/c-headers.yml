name: Build C header archive

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release to attach the C archive to (optional)
        required: false

permissions:
  contents: read

jobs:
  headers:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: brew install cmake ninja zstd
      - name: Build and test the C headers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          clang=$(python3 -m tools.toolchain.official_llvm prepare --cache "$RUNNER_TEMP/llvm")/bin/clang
          python3 -m tools.sources.locked_sources prepare --sdk macosx26.5
          make c-archive OUT="$RUNNER_TEMP/c-headers" CLANG="$clang"
          python3 -m unittest discover -s tests -p test_pack_archive.py
      - uses: actions/upload-artifact@v7
        with:
          name: apple-oss-c-headers-macosx26.5
          path: build/apple-oss-c-headers-macosx26.5.tar.zst
          if-no-files-found: error

  attach-to-draft:
    needs: headers
    if: github.ref == 'refs/heads/main' && inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: apple-oss-c-headers-macosx26.5
      - name: Attach archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "$(gh release view --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft -- "$RELEASE_TAG")" = true
          gh release upload --repo "$GITHUB_REPOSITORY" -- "$RELEASE_TAG" apple-oss-c-headers-macosx26.5.tar.zst
